[versions]
agp = "9.4.0"
desugar_jdk_libs_nio = "2.1.5"
gson = "2.14.0"
# isoparser 1.1.x pulls in a shaded AspectJ runtime; 1.0.6 is the lean, Android-safe line.
#noinspection GradleDependency
isoparser = "1.0.6"
junit = "4.13.2"
appcompat = "1.8.0"
material = "1.14.0"
media3 = "1.11.1"
mockito = "5.24.0"
# MMKV 2.x dropped 32-bit ABIs and Android < 6, 1.3.x keeps every device working.
#noinspection GradleDependency
mmkv = "1.3.17"
activity = "1.13.0"
constraintlayout = "2.2.2"
media = "1.8.0"
newpipeextractor = "v0.26.5-dev-eb53b79"
picasso = "2.8"
swiperefreshlayout = "1.2.0"
webkit = "1.17.1"
okhttp = "5.5.0"
okio = "3.18.2"
recyclerview = "1.4.0"
lifecycle = "2.11.0"
profileinstaller = "1.4.1"

[libraries]
desugar_jdk_libs_nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar_jdk_libs_nio" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
isoparser = { module = "com.googlecode.mp4parser:isoparser", version.ref = "isoparser" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
#noinspection Aligned16KB
mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
media = { module = "androidx.media:media", version.ref = "media" }
newpipeextractor = { module = "net.newpipe:extractor", version.ref = "newpipeextractor" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
